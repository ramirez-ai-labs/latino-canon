name: Run groundedness eval

# Manual, one-off (and repeatable) run of the blurb groundedness judge against the
# whole live catalog. Not wired into validate-pr.yml or any push trigger - this
# calls Workers AI for every title with a stored blurb, so it costs real neurons
# and should run on demand, not on every PR.
#
# Reuses the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets already granted
# to deploy-api.yml (D1:Edit, which this also needs to enumerate title ids) - see
# ROADMAP.md item #2 ("verify pnpm eval:groundedness's rewritten judge actually
# works... needs a real CLOUDFLARE_API_TOKEN to test").

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  groundedness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_URL: https://latino-canon-api.ai-builders-studio-latinx.workers.dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run groundedness eval
        run: pnpm --filter @latino-canon/eval run groundedness

      # A prior run finished clean (187/187, mean 0.512) yet the artifact upload
      # step still warned "No files were found with the provided path:
      # packages/eval/.eval-out/" - pnpm --filter's cwd for the script is
      # confirmed correct locally (packages/eval), so this checks what's
      # actually on disk right after generation, before either consumer step
      # (D1 record, artifact upload) tries to read it, instead of guessing again.
      - name: Debug - locate eval output on disk
        if: always()
        run: |
          echo "--- looking for .eval-out anywhere under the workspace ---"
          find . -maxdepth 4 -iname ".eval-out" -not -path "*/node_modules/*" 2>&1 || true
          echo "--- packages/eval/.eval-out/ directly ---"
          ls -la packages/eval/.eval-out/ 2>&1 || echo "does not exist"
          echo "--- pwd at this step ---"
          pwd

      # run-groundedness.ts writes a ready-to-run INSERT (packages/eval/src/record-run.ts,
      # SQL-escaped in JS - not shell-interpolated) alongside its JSON output, so the
      # dashboard at apps/web's /eval page has something durable to read instead of only
      # this run's log/artifact. See apps/api/migrations/0016_eval_runs.sql.
      - name: Record eval run in D1
        run: npx wrangler d1 execute latino-canon --remote --file=packages/eval/.eval-out/insert.sql

      - name: Upload eval output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: groundedness-eval-output
          path: packages/eval/.eval-out/
          if-no-files-found: warn
          # .eval-out is a dot-directory - actions/upload-artifact@v4 excludes
          # hidden files/dirs by default, which is the entire reason every run
          # so far warned "No files were found" even when the debug step right
          # before this one confirmed the file was genuinely there.
          include-hidden-files: true
