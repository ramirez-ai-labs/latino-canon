name: Run groundedness eval

# Manual, one-off (and repeatable) run of the blurb groundedness judge against the
# whole live catalog. Not wired into validate-pr.yml or any push trigger - this
# calls Workers AI for every title with a stored blurb, so it costs real neurons
# and should run on demand, not on every PR.
#
# Reuses the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets already granted
# to deploy-api.yml (D1:Edit, which this also needs to enumerate title ids) - see
# ROADMAP.md item #2 ("verify pnpm eval:groundedness's rewritten judge actually
# works... needs a real CLOUDFLARE_API_TOKEN to test").

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  groundedness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_URL: https://latino-canon-api.ai-builders-studio-latinx.workers.dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enumerate title ids with a stored blurb
        id: ids
        working-directory: apps/api
        run: |
          npx wrangler d1 execute latino-canon --remote --json \
            --command "SELECT id FROM titles WHERE id IN (SELECT title_id FROM blurbs);" \
            > /tmp/blurb-ids.json
          node -e '
            const data = require("/tmp/blurb-ids.json");
            const ids = data[0].results.map(r => r.id);
            require("fs").writeFileSync("/tmp/ids.txt", ids.join(" "));
            console.log(`found ${ids.length} titles with a stored blurb`);
          '

      - name: Run groundedness eval
        run: pnpm --filter @latino-canon/eval run groundedness $(cat /tmp/ids.txt)

      # run-groundedness.ts writes a ready-to-run INSERT (packages/eval/src/record-run.ts,
      # SQL-escaped in JS - not shell-interpolated) alongside its JSON output, so the
      # dashboard at apps/web's /eval page has something durable to read instead of only
      # this run's log/artifact. See apps/api/migrations/0016_eval_runs.sql.
      - name: Record eval run in D1
        working-directory: apps/api
        run: npx wrangler d1 execute latino-canon --remote --file=../../packages/eval/.eval-out/insert.sql

      - name: Upload eval output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groundedness-eval-output
          path: packages/eval/.eval-out/
          if-no-files-found: warn
