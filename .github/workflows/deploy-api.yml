name: Deploy api Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-api.yml"

permissions:
  contents: read

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck api worker
        run: pnpm --filter @latino-canon/api run typecheck

      # continue-on-error: a migration failure (e.g. CLOUDFLARE_API_TOKEN missing D1
      # permissions - the exact thing that happened the first time this step ran)
      # must not block deploying the Worker code, which is otherwise unrelated. The
      # step still shows failed/yellow in the Actions UI, so it stays visible - it
      # just can't take the whole job down with it. Ordered before deploy anyway, in
      # case a future migration is one new code actually depends on.
      - name: Apply D1 migrations
        id: migrate
        continue-on-error: true
        run: pnpm --filter @latino-canon/api run db:migrate:remote

      - name: Deploy api Worker
        run: pnpm --filter @latino-canon/api run deploy

      - name: Fail the job if migrations didn't apply
        if: steps.migrate.outcome == 'failure'
        run: |
          echo "::error::D1 migrations failed to apply - see the 'Apply D1 migrations' step above (often a CLOUDFLARE_API_TOKEN permissions issue). The Worker deployed anyway; migrations still need to be applied."
          exit 1
