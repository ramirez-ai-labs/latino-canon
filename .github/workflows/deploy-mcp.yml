name: Deploy MCP Worker

# The remote MCP server (apps/mcp). It calls the api over a service binding, so a change
# to packages/core (the types and taxonomy it formats with) redeploys it too.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/mcp/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-mcp.yml"

permissions:
  contents: read

concurrency:
  group: deploy-mcp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MCP_URL: https://latino-canon-mcp.ai-builders-studio-latinx.workers.dev/mcp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck MCP server
        run: pnpm --filter @latino-canon/mcp run typecheck

      - name: Deploy MCP Worker
        run: pnpm --filter @latino-canon/mcp run deploy

      # What a client does first: initialize, then list tools. Costs no neurons - neither
      # call reaches a tool. A failure here means claude.ai's connector would fail too.
      - name: Smoke test the live server
        run: |
          headers=(-H "content-type: application/json" -H "accept: application/json, text/event-stream")
          init=$(curl -sf "${headers[@]}" "$MCP_URL" -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"deploy-smoke","version":"0"}}}')
          echo "$init" | jq -e '.result.serverInfo.name == "latino-canon"' > /dev/null
          tools=$(curl -sf "${headers[@]}" -H "mcp-protocol-version: 2025-06-18" "$MCP_URL" -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}')
          echo "$tools" | jq -r '.result.tools[].name'
          echo "$tools" | jq -e '[.result.tools[].name] | sort == ["curate","get_title","search_titles","similar_titles"]' > /dev/null
