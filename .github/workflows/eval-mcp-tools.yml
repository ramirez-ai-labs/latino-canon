name: Run MCP tool-selection eval

# Manual: does a model, given only what the live MCP server tells every client (its
# instructions and tools/list), call the right tool with the right arguments? Scoring is in
# packages/eval/src/mcp-tools.ts, the cases in datasets/mcp-tools.jsonl, and the result is
# recorded in D1 for the Eval page.
#
# Not on a push trigger: 41 cases with the tool list in every prompt cost ~1.9k neurons on
# the 70B (the first 30-case run measured 1,408), so this is the day's one extra 70B job
# (CLAUDE.md, budget rules). Run it after changing a tool's name, description, schema or the
# server's instructions, and compare with the last run on the Eval page.
#
# `model` scores a second function-calling model against the same cases (Llama 4 Scout, ~1.7k
# on this set: most of the cost is input tokens, priced close to the 70B's), to show whether
# the descriptions work beyond the model they were written against. The budget claim is per
# kind, so a second model the same day is allowed, but two full runs together (~3.6k) are
# over the ~2k cap: run the second model on another day.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model to score (each has function calling in the Workers AI catalog)"
        type: choice
        required: false
        default: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
        options:
          - "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
          - "@cf/meta/llama-4-scout-17b-16e-instruct"
          - "@cf/mistralai/mistral-small-3.1-24b-instruct"
      cases:
        description: "Comma-separated case ids to run (blank = all). A subset isn't recorded."
        required: false
        default: ""
      override_reason:
        description: "Run even if today already had a 70B job or an ingest (recorded with this reason). Blank = follow the budget rule."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  mcp-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CASES: ${{ inputs.cases }}
      TOOL_MODEL: ${{ inputs.model || '@cf/meta/llama-3.3-70b-instruct-fp8-fast' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The budget rule, enforced (apps/ingest/src/budget.ts): this is the day's one extra
      # 70B job (~1.9k neurons, just under the ~2k cap, so a queue day is fine). A subset run
      # spends too, so it claims as well.
      - name: Claim today's 70B budget slot
        env:
          INGEST_URL: ${{ vars.INGEST_URL }}
          INGEST_ADMIN_TOKEN: ${{ secrets.INGEST_ADMIN_TOKEN }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
        run: |
          body=$(jq -n --arg kind eval-mcp-tools --arg reason "$OVERRIDE_REASON" \
            '{kind: $kind} + (if $reason == "" then {} else {overrideReason: $reason} end)')
          status=$(curl -sS -o claim.json -w '%{http_code}' -X POST "$INGEST_URL/budget/claim" \
            -H "authorization: Bearer $INGEST_ADMIN_TOKEN" -H "content-type: application/json" -d "$body")
          cat claim.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::Workers AI budget: $(jq -r '.reason // .error' claim.json). Re-run with override_reason to run anyway."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run MCP tool-selection eval
        run: pnpm --filter @latino-canon/eval run mcp-tools

      # A subset run is for checking a fix, not a result: recording it would put a partial
      # score on the Eval page next to full runs.
      - name: Record eval run in D1
        if: inputs.cases == ''
        run: npx wrangler d1 execute latino-canon --remote --file=packages/eval/.eval-out/insert.sql

      - name: Upload eval output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-tools-eval-output
          path: packages/eval/.eval-out/
          if-no-files-found: warn
          include-hidden-files: true
