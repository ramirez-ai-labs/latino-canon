name: Security audit

# A failing check for known advisories: weekly against what's already locked, and on any
# PR that changes the lockfile. Fix with a direct upgrade or a targeted `pnpm.overrides`
# entry in the root package.json (see the postcss and undici ones).
#
# It complements Dependabot rather than replacing it: security updates are on (repo
# setting, 2026-09-29) and open fix PRs, but they can't do a coordinated upgrade -
# Dependabot's vitest 2 -> 4 PR (#304) failed CI because vitest, vite and
# @cloudflare/vitest-pool-workers have to move together.

on:
  schedule:
    - cron: "0 15 * * 1" # Mondays 15:00 UTC
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "pnpm-lock.yaml"
      - "**/package.json"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # All dependencies, dev tooling included. It was production-only ("dev tooling never
      # ships to a Worker"), and missed 45 advisories - 7 critical - in the test and build
      # toolchain (vitest, vite, undici, an old wrangler inside vitest-pool-workers). That
      # tooling runs in CI with CLOUDFLARE_API_TOKEN in its environment and on developer
      # machines, so it's supply chain too. High and critical fail the check; moderate and
      # low still print for review.
      - name: Audit all dependencies
        run: pnpm audit --audit-level high
