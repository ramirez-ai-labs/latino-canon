name: Run curation eval

# Manual: do the curation agent's picks meet the hard constraints each request states
# (director gender, kind, decade, country, genre, content advisory, theme)? Every check is a
# comparison with catalog metadata - no LLM judge. Scoring is in packages/eval/src/curation.ts,
# the 10 requests in datasets/curation.jsonl, and the result is recorded in D1.
#
# It's the ship gate for agentic curation v2 (docs/design/AGENTIC_CURATION_V2.md): run it
# against v1 (the live api) and against a non-live version with CURATE_AGENT=v2 (`api_url`),
# and compare. v1 spends a few 8B neurons a run, so it needs no budget slot. A v2 target spends
# ~1.8k 70B neurons, the day's one optional 70B job: set `v2` so the run claims it first.

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "api to evaluate (blank = the live api). A preview version's URL to measure before merge."
        required: false
        default: ""
      v2:
        description: "The target serves the v2 agent: claim today's 70B budget slot before running"
        type: boolean
        required: false
        default: false
      cases:
        description: "Comma-separated case ids to run (blank = all). A subset isn't recorded."
        required: false
        default: ""
      override_reason:
        description: "With v2: run even if today's 70B slot is taken (recorded with this reason)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  curation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Inputs reach the shell as environment variables, never interpolated into a script.
      API_URL_INPUT: ${{ inputs.api_url }}
      CASES: ${{ inputs.cases }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The budget rule, enforced (apps/ingest/src/budget.ts): a v2 run is the day's one extra
      # 70B job. A v1 run costs a few 8B neurons and doesn't claim.
      - name: Claim today's 70B budget slot
        if: inputs.v2
        env:
          INGEST_URL: ${{ vars.INGEST_URL }}
          INGEST_ADMIN_TOKEN: ${{ secrets.INGEST_ADMIN_TOKEN }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
        run: |
          body=$(jq -n --arg kind eval-curation --arg reason "$OVERRIDE_REASON" \
            '{kind: $kind} + (if $reason == "" then {} else {overrideReason: $reason} end)')
          status=$(curl -sS -o claim.json -w '%{http_code}' -X POST "$INGEST_URL/budget/claim" \
            -H "authorization: Bearer $INGEST_ADMIN_TOKEN" -H "content-type: application/json" -d "$body")
          cat claim.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::Workers AI budget: $(jq -r '.reason // .error' claim.json). Re-run with override_reason to run anyway."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run curation eval
        run: |
          if [ -n "$API_URL_INPUT" ]; then export API_URL="$API_URL_INPUT"; fi
          pnpm --filter @latino-canon/eval run curation

      # A subset run is for checking a fix, not a result: recording it would put a partial
      # score on the Eval page next to full runs.
      - name: Record eval run in D1
        if: inputs.cases == ''
        run: npx wrangler d1 execute latino-canon --remote --file=packages/eval/.eval-out/insert.sql

      - name: Upload eval output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: curation-eval-output
          path: packages/eval/.eval-out/
          if-no-files-found: warn
          include-hidden-files: true
