name: Deploy ingest Worker

# This deploys the ingest Workflow's *code* - including canon.seed.json, which the
# worker bundles for its daily ingest queue (src/ingest-queue.ts). A merged seed change
# reaches the queue through this deploy; ingestion itself happens on the next cron.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/ingest/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-ingest.yml"

permissions:
  contents: read

concurrency:
  group: deploy-ingest-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck ingest worker
        run: pnpm --filter @latino-canon/ingest run typecheck

      - name: Deploy ingest Worker
        run: pnpm --filter @latino-canon/ingest run deploy
