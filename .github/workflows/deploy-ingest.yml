name: Deploy ingest Worker

# This deploys the ingest Workflow's *code* - including canon.seed.json, which the
# worker bundles for its daily ingest queue (src/ingest-queue.ts). A merged seed change
# reaches the queue through this deploy; ingestion itself happens on the next cron.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/ingest/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-ingest.yml"

permissions:
  contents: read
  actions: read # to find and wait on this commit's deploy-api run

concurrency:
  group: deploy-ingest-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the migration check diffs against the push's previous head

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck ingest worker
        run: pnpm --filter @latino-canon/ingest run typecheck

      # Ingest writes to the shared D1 schema, and api's deploy applies the migrations.
      # Both deploy in parallel when a push touches packages/core, so a new ingest could
      # go live against a schema that doesn't have its columns yet - #261 (blurb verdict
      # columns) was only safe because nothing ingested in that window. When this push
      # adds a migration, wait for this commit's deploy-api run and deploy only if it
      # (and so its migrations) succeeded.
      - name: Wait for this commit's D1 migrations
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT" != "push" ]]; then
            echo "Manual run - not waiting on migrations."
            exit 0
          fi
          if ! git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -q '^apps/api/migrations/'; then
            echo "No new migrations in this push."
            exit 0
          fi
          id=""
          for _ in $(seq 1 12); do
            id=$(gh run list --workflow deploy-api.yml --commit "$GITHUB_SHA" --json databaseId -q '.[0].databaseId')
            [[ -n "$id" ]] && break
            sleep 10
          done
          if [[ -z "$id" ]]; then
            echo "::error::This push adds a migration but no deploy-api run started for $GITHUB_SHA within 2 minutes."
            exit 1
          fi
          echo "Waiting on deploy-api run $id (applies the migrations)..."
          if ! gh run watch "$id" --exit-status --interval 15 > /dev/null; then
            echo "::error::deploy-api run $id failed, so its migrations may not have applied. Not deploying ingest against an old schema - fix deploy-api, then re-run this workflow."
            exit 1
          fi

      - name: Deploy ingest Worker
        run: pnpm --filter @latino-canon/ingest run deploy
