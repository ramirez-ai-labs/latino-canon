name: Deploy ingest Worker

# This deploys the ingest Workflow's *code*. It's separate from
# ingest-new-titles.yml, which only POSTs newly added canon.seed.json entries to
# whichever code is already live - it never runs `wrangler deploy`, so a change to
# apps/ingest's own source never reached production without this.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/ingest/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-ingest.yml"

permissions:
  contents: read

concurrency:
  group: deploy-ingest-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck ingest worker
        run: pnpm --filter @latino-canon/ingest run typecheck

      - name: Deploy ingest Worker
        run: pnpm --filter @latino-canon/ingest run deploy
