name: Validate pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web app
        run: pnpm --filter @latino-canon/web run typecheck

      - name: Typecheck API
        run: pnpm --filter @latino-canon/api run typecheck

      - name: Typecheck core
        run: pnpm --filter @latino-canon/core run typecheck

      - name: Typecheck eval
        run: pnpm --filter @latino-canon/eval run typecheck

      - name: Typecheck ingest
        run: pnpm --filter @latino-canon/ingest run typecheck

      - name: Test core (RRF ranking)
        run: pnpm --filter @latino-canon/core run test

      - name: Test eval (retrieval metrics)
        run: pnpm --filter @latino-canon/eval run test

      - name: Test ingest (TMDB/OMDb mapping, normalization)
        run: pnpm --filter @latino-canon/ingest run test

      - name: Test API (includes fixture-backed lexical retrieval regression)
        run: pnpm --filter @latino-canon/api run test

      - name: Validate web OpenNext build
        run: pnpm --filter @latino-canon/web exec opennextjs-cloudflare build
