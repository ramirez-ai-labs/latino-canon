packages:
  - "apps/*"
  - "packages/*"

# Targeted fixes for transitive advisories that a direct upgrade can't reach (see
# .github/workflows/security-audit.yml). These lived under "pnpm.overrides" in the root
# package.json until pnpm 11 stopped reading that field; here both pnpm 10 and 11 apply them.
overrides:
  "postcss@<8.5.23": "^8.5.28"
  # GHSA-xjj6-f33q-929c, via wrangler > miniflare (pins undici 7.29.x exactly).
  "undici@>=7.0.0 <7.30.1": "^7.30.1"
  # GHSA-wq5f-xc86-pv6w (librsvg), via wrangler > miniflare.
  "sharp@<0.35.5": "^0.35.5"
  "brace-expansion@>=2.0.0 <2.1.6": "^2.1.6"
  "brace-expansion@>=4.0.0 <5.0.11": "^5.0.11"
  # GHSA-68fv-2mgg-jv7q, via @tailwindcss/postcss > @tailwindcss/node.
  "source-map-js@>=1.0.0 <1.2.2": "^1.2.2"
  # GHSA-5j98-mcp5-4vw2, via @opennextjs/aws > @node-minify/core 9 (Dependabot #324).
  "glob@>=10.2.0 <10.5.0": "^10.5.0"
  # GHSA-mrhx-c7xc-m3w5, via @cloudflare/vitest-pool-workers (pins zod 4.4.3 exactly, still in 0.23.0).
  "zod@>=4.0.0 <4.6.6": "^4.6.7"
  # GHSA-27r3-jxmh-p828, via @modelcontextprotocol/sdk > express.
  "body-parser@>=2.0.0 <2.4.0": "^2.4.0"
